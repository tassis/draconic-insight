name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - neoforge: '21.1.228'
            jei: '19.21.0.247'
          - neoforge: '21.1.249'
            jei: '19.51.0.418'
          - neoforge: '21.1.266'
            jei: '19.51.0.418'

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: '9.2.1'

      - name: Read and validate version
        shell: bash
        run: |
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          minecraft_version="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          mod_loader="$(sed -n 's/^mod_loader=//p' gradle.properties)"
          mod_id="$(sed -n 's/^mod_id=//p' gradle.properties)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "mod_version is invalid: $version" >&2
            exit 1
          fi
          if [[ ! "$minecraft_version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "minecraft_version must be a numeric Minecraft version, got: $minecraft_version" >&2
            exit 1
          fi
          if [[ ! "$mod_loader" =~ ^[a-z0-9-]+$ ]]; then
            echo "mod_loader must contain only lowercase letters, numbers, and hyphens, got: $mod_loader" >&2
            exit 1
          fi
          if [[ ! "$mod_id" =~ ^[a-z][a-z0-9_]*$ ]]; then
            echo "mod_id is invalid: $mod_id" >&2
            exit 1
          fi

      - name: Test and build
        run: gradle --no-daemon clean test build "-Pneo_version=${{ matrix.neoforge }}" "-Pjei_version=${{ matrix.jei }}"

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-report-${{ matrix.neoforge }}-${{ github.run_number }}
          path: |
            build/reports/tests/test/
            build/tutorial-smoke-*.json
            build/tutorial-server-smoke-*.json
          if-no-files-found: ignore
